<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Filter Workbench · WebGL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Photo Filter Workbench</h1>
    <p>Upload a photo, preview 100 film and cinematic filters in real time, and drag the slider to compare before and after.</p>
  </header>

  <div class="layout">
    <aside class="filters-col" id="colLeft" aria-label="Filter list 1"></aside>

    <main class="stage" id="stage">
      <div class="canvas-wrap">
        <div class="compare" id="compare">
          <canvas id="canvasOriginal"></canvas>
          <canvas id="canvasFiltered"></canvas>
          <div class="handle" id="handle">
            <div class="handle-line"></div>
            <div class="handle-grip">⇔</div>
          </div>
          <span class="badge before">Filter</span>
          <span class="badge after">Original</span>
          <div class="empty-state" id="emptyState">Drop an image here, or click Upload Image below to start.</div>
        </div>
      </div>

      <div class="slider-row">
        <input type="range" id="slider" min="0" max="100" value="50" disabled aria-label="Comparison slider">
      </div>

      <div class="controls">
        <button class="action" id="uploadBtn" type="button">Upload Image</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button class="action" id="downloadBtn" type="button" disabled>Download Image</button>
      </div>

      <div class="current-filter" id="currentFilterLabel"></div>
    </main>

    <aside class="filters-col" id="colRight" aria-label="Filter list 2"></aside>
  </div>
</div>

<script src="filters.js"></script>
<script src="app.js"></script>
</body>
</html>
